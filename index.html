<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LDIF-Historie</title>
  <meta name="description" content="Die Geschichte einzelner LDAP-Objekte anhand eines Basis-LDIF und nachfolgender Änderungs-LDIFs durchspielen.">
  <link rel="stylesheet" href="css/style.css?v=202610281900">
</head>
<body>
  <header class="kopf">
    <h1>LDIF-Historie</h1>
    <p class="unterzeile">Verzeichnis <code>dc=beispiel,dc=de</code> – Objekt wählen und seine Änderungen auf dem Zeitstrahl durchspielen.</p>
  </header>

  <main class="layout">
    <aside class="panel seite" aria-label="Objekte">
      <div class="reiter" role="tablist">
        <button type="button" role="tab" id="tab-objekte" aria-controls="objekte-panel">Objekte</button>
        <button type="button" role="tab" id="tab-baum" aria-controls="baum-panel">Verzeichnis</button>
        <button type="button" role="tab" id="tab-protokoll" aria-controls="protokoll-panel">Änderungsprotokoll</button>
      </div>

      <div id="objekte-panel" role="tabpanel" aria-labelledby="tab-objekte" class="reiter-inhalt">
        <div class="werkzeuge">
          <input type="search" id="objekt-suche" placeholder="Suchen: Name, uid, Mail, DN …" aria-label="Objekte suchen" autocomplete="off">
          <div class="filter" id="typ-filter" role="group" aria-label="Nach Typ filtern"></div>
          <div class="filter" id="status-filter" role="group" aria-label="Nach Status filtern"></div>
          <label class="schalter">Sortieren:
            <select id="sortierung">
              <option value="name">Name</option>
              <option value="zuletzt">Zuletzt geändert</option>
              <option value="anzahl">Anzahl Änderungen</option>
            </select>
          </label>
        </div>
        <p class="liste-titel" id="objekte-titel"></p>
        <ol class="objekte" id="objekte"></ol>
      </div>

      <div id="baum-panel" role="tabpanel" aria-labelledby="tab-baum" class="reiter-inhalt" hidden>
        <p class="liste-titel" id="baum-titel"></p>
        <div id="baum" class="baum"></div>
      </div>

      <div id="protokoll-panel" role="tabpanel" aria-labelledby="tab-protokoll" class="reiter-inhalt" hidden>
        <div class="werkzeuge">
          <input type="search" id="protokoll-suche" placeholder="Filtern: Name, uid, Datei …" aria-label="Protokoll filtern" autocomplete="off">
          <div class="filter" id="art-filter" role="group" aria-label="Nach Art filtern"></div>
        </div>
        <p class="liste-titel" id="protokoll-titel"></p>
        <ol class="protokoll" id="protokoll"></ol>
      </div>
    </aside>

    <section class="panel detail" id="detail" aria-live="polite"></section>
  </main>

  <footer class="fuss">
    Alle Daten sind fiktiv. Die LDIF-Dateien liegen im Ordner <code>ldif/</code> des Repositorys, die Liste in <code>js/dateien.js</code>.
  </footer>

  <script src="js/ldif.js?v=202610281900"></script>
  <script src="js/historie.js?v=202610281900"></script>
  <script src="js/dateien.js?v=202610281900"></script>
  <script src="js/app.js?v=202610281900"></script>
</body>
</html>
